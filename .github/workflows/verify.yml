name: Verify research snapshot and reconstruction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m visionpro audit --output /tmp/audit.json
      - run: diff results/historical_audit.json /tmp/audit.json
      - run: PYTHONPATH=src python -m visionpro terms --output /tmp/terms.json
      - run: diff results/historical_terms.json /tmp/terms.json
      - run: python scripts/verify_project.py
